name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "client/**"

  pull_request:
    branches:
      - main
    paths:
      - "client/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run linter and formatting
        run: |
          npm run lint
          npx prettier --check .

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build
