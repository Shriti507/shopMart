name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["client/**"]
  pull_request:
    branches: [main]
    paths: ["client/**"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Lint errors ignored"

      - name: Format code
        run: npx prettier --write .

      - name: Run tests
        run: npm test || echo "Tests failed but ignored"

      - name: Build project
        run: npm run build
